{% extends "base.html" %}

{% block content %}
<h1>My Courses</h1>
{% if my_courses %}
<ul>
    {% for course in my_courses %}
    <li>
        <a href="{% url 'courses:course_detail' course.id %}">{{ course.name }}</a>
    </li>
    {% endfor %}
</ul>
{% else %}
<p>No courses yet!</p>
{% endif %}
{% endblock %}
