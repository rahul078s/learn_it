<!DOCTYPE html>
<html>

<body>
    {% if course_list %}
    <ul>
        {% for course in course_list %}
        <li><a href="{% url 'courses:course_detail' course.id %} ">{{ course.name }}</a></li>
        {% endfor %}
    </ul>
    {% else %}
    <p>Currently, no course is available!</p>
    {% endif %}
</body>

</html>
