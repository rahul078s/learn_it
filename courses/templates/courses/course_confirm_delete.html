{% extends "base.html" %}

{% block content %}
    <h2>Delete Course</h2>
    <form method="post"> {% csrf_token %}
        <p>Are you sure you want to delete "{{ course.name }}"?</p>
        {{ form }}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'courses:course_detail' object.id %}">Cancel</a>
    </form>
{% endblock %}
