{% extends "base.html" %}

{% block content %}
<h1>My Enrollements</h1>
<ul>
    {% for course in enrolled_courses %}
    <li>
        <a href="{% url 'courses:course_detail' course.id %}">
            {{ course.name }}
        </a>
    </li>
    {% empty %}
    <p>You are not enrolled in any courses yet!</p>
    {% endfor %}
</ul>
{% endblock %}
